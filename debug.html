<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug — Kora Port</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/header-footer.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/animations.css">
<style>
.test{background:var(--color-bg-card);padding:16px;margin:10px 0;border-radius:8px;border:1px solid var(--color-border-subtle)}
.ok{color:green;font-weight:bold}
.fail{color:red;font-weight:bold}
</style>
</head>
<body>
<div id="app-header"></div>
<main class="container" style="padding:20px 16px;min-height:60vh">
<h1>🔧 Full Debug Test</h1>
<div id="results"></div>
<h2 style="margin-top:24px">📦 Product Cards Test:</h2>
<div class="product-grid" id="testGrid"></div>
</main>
<div id="app-footer"></div>

<script src="js/config.js"></script>
<script src="js/products-data.js"></script>
<script src="js/main.js"></script>
<script src="js/home.js"></script>
<script>
var r = document.getElementById('results');
function log(name, ok, detail) {
  r.innerHTML += '<div class="test"><strong>'+name+'</strong>: <span class="'+(ok?'ok':'fail')+'">'+(ok?'✅ OK':'❌ FAIL')+'</span>'+(detail?'<br><small>'+detail+'</small>':'')+'</div>';
}

log('config.js', typeof CONFIG !== 'undefined', typeof CONFIG !== 'undefined' ? 'Store: '+CONFIG.store.name : '');
log('products-data.js', typeof PRODUCTS !== 'undefined', typeof PRODUCTS !== 'undefined' ? PRODUCTS.length+' products, '+CATEGORIES.length+' categories' : '');
log('main.js', typeof formatPrice === 'function', 'formatPrice: '+(typeof formatPrice)+', renderStars: '+(typeof renderStars)+', updateCartBadge: '+(typeof updateCartBadge));
log('home.js', typeof createProductCard === 'function', 'createProductCard: '+(typeof createProductCard));
log('Header', !!document.getElementById('siteHeader'), document.getElementById('siteHeader')?'Header rendered':'Header NOT found');
log('Footer', !!document.querySelector('.site-footer'), document.querySelector('.site-footer')?'Footer rendered':'Footer NOT found');

if (typeof createProductCard === 'function' && typeof PRODUCTS !== 'undefined') {
  var grid = document.getElementById('testGrid');
  var html = '';
  PRODUCTS.slice(0, 6).forEach(function(p) { html += createProductCard(p); });
  grid.innerHTML = html;
  log('Product Cards', html.length > 100, html.length + ' chars of HTML generated, ' + PRODUCTS.slice(0,6).length + ' cards rendered');
} else {
  log('Product Cards', false, 'Cannot render — missing functions');
}
</script>
</body>
</html>
