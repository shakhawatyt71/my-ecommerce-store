[build]
  publish = "."

# Cache Control - Force fresh content
[[headers]]
  for = "/*"
    [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/js/*"
    [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
    [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirects for clean URLs
[[redirects]]
  from = "/shop"
  to = "/pages/shop.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/pages/cart.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/pages/checkout.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 200

[[redirects]]
  from = "/track-order"
  to = "/pages/track-order.html"
  status = 200

[[redirects]]
  from = "/orders"
  to = "/pages/orders.html"
  status = 200
